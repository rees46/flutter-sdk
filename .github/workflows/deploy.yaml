name: Deploy

on:
  push:
    # Which branch is the trunk is decided in the job below, not here: `on:` takes
    # literal branch names and never evaluates ${{ }}, so a hardcoded `master`
    # silently never fires in the personaclick mirror, whose trunk is `main`.
    # '**' matches every branch while still keeping tag pushes out of this
    # workflow — those belong to publish.yaml.
    branches:
      - '**'
  workflow_dispatch:

# Auto-tags a release when the pubspec version is new. The tag is pushed with a
# GitHub App token (not GITHUB_TOKEN, which by design would not trigger other
# workflows) so that publish.yaml fires and publishes to pub.dev via OIDC.
# The job always completes successfully, so the sync workflow (gated on Deploy
# success) keeps working even before tagging is configured.
jobs:
  tag:
    name: Tag release on version bump
    runs-on: ubuntu-latest

    # Tag only from the canonical repository owner, and only for a push to that
    # repository's own default branch — `master` here, `main` in the mirror.
    # Every other branch push starts this workflow and stops on this line.
    if: |
      github.repository_owner == 'rees46' &&
      github.ref_name == github.event.repository.default_branch

    steps:
      # Self-activates once VERSIONER_ID / VERSIONER_SECRET are set.
      # Until then tagging is skipped, but the job stays green.
      - name: Resolve tagging readiness
        id: ready
        env:
          APP_ID: ${{ vars.VERSIONER_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSIONER_ID not set — skipping auto-tagging"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint app token
        id: app-token
        if: steps.ready.outputs.ready == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VERSIONER_ID }}
          private-key: ${{ secrets.VERSIONER_SECRET }}

      - name: Checkout
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Two commits, so the step below can diff HEAD against its parent.
          fetch-depth: 2

      - name: Tag if version is new
        if: steps.ready.outputs.ready == 'true'
        run: |
          # Tag only the commit that introduced the version. This job runs on
          # every push to the trunk, so most runs read a pubspec that was tagged
          # releases ago — harmless while that tag exists, but the moment one is
          # missing it would pin the old name onto a much later commit.
          if ! git diff --name-only HEAD~1 HEAD | grep -qx 'pubspec.yaml'; then
            echo "pubspec.yaml unchanged in HEAD — not a release commit"
            exit 0
          fi

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" \
              >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed $TAG"
